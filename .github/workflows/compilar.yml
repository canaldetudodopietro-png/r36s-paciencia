name: Compilar Paciência R36S

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código Fonte
      uses: actions/checkout@v4

    - name: Configurar Multiarquitetura e Compiladores
      run: |
        sudo dpkg --add-architecture arm64
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu libsdl2-dev:arm64

    - name: Compilar Executável para R36S
      run: |
        aarch64-linux-gnu-gcc main.c -o paciencia_r36s \
          -I/usr/include/SDL2 \
          -L/usr/lib/aarch64-linux-gnu \
          -lSDL2 -lm

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Jogo_Paciencia_R36S
        path: paciencia_r36s
