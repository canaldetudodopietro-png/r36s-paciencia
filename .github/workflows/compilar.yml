name: Compilar Paciência R36S

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Codigo Fonte
      uses: actions/checkout@v4

    - name: Instalar Compilador ARM64
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Baixar Bibliotecas SDL2 ARM64
      run: |
        mkdir -p sdl2_libs
        cd sdl2_libs
        # Baixa os pacotes oficiais compilados para arquitetura ARM64 (Ubuntu)
        wget http://ubuntu.com
        wget http://ubuntu.com
        
        # Extrai os pacotes locais
        dpkg-deb -x libsdl2-2.0-0_*.deb .
        dpkg-deb -x libsdl2-dev_*.deb .
        cd ..

    - name: Compilar Executavel
      run: |
        aarch64-linux-gnu-gcc main.c -o paciencia_r36s \
          -I./sdl2_libs/usr/include/SDL2 \
          -L./sdl2_libs/usr/lib/aarch64-linux-gnu \
          -lSDL2 -lm -Wl,-rpath,/usr/lib/aarch64-linux-gnu

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Jogo_Paciencia_R36S
        path: paciencia_r36s
