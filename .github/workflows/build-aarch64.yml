name: build-aarch64
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: Compilar em container arm64 (Debian bullseye, glibc 2.31 para ser compativel com CFWs antigos)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/w -w /w debian:bullseye bash -c \
            "apt-get update && apt-get install -y build-essential libsdl2-dev zip && make test && make package"
      - uses: actions/upload-artifact@v4
        with:
          name: paciencia-port
          path: dist/paciencia.zip
