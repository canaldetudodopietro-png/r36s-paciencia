# Paciencia: o cursor e movido pelo analogico esquerdo ou D-Pad (mouse emulado pelo gptokeyb2).
[config]
mouse_delay = 16
deadzone_mode = scaled_radial
deadzone_scale = 6
deadzone_x = 2000
deadzone_y = 2000

[controls]
a = "mouse_left"
b = "mouse_right"
x = mouse_slow
y = "u"

l1 = "t"
r1 = "a"

start = "f2"
back = "esc"

dpad = mouse_movement
left_analog = mouse_movement
right_analog =
